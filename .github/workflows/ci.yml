name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist is in sync
        run: |
          git diff --exit-code dist/ || (echo "dist/ is out of sync with source. Run 'npm run build' and commit." && exit 1)
